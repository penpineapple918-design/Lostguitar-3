<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lost Guitar</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Faint guitar background */
.guitar-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
  opacity: 0.08;
}

.guitar {
  position: absolute;
  color: #ff0015;
  font-size: 150px;
  transform: rotate(-25deg);
}

.guitar:nth-child(1) {
  top: 80px;
  left: -45px;
}

.guitar:nth-child(2) {
  top: 430px;
  right: -55px;
  transform: rotate(25deg);
}

.guitar:nth-child(3) {
  top: 850px;
  left: -40px;
  transform: rotate(-20deg);
}

/* Main app */
.app {
  position: relative;
  z-index: 1;
  max-width: 700px;
  margin: auto;
  padding: 25px 20px 120px;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.logo {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #ff0818;
}

.guitar-icon {
  font-size: 30px;
}

/* Greeting */
.greeting {
  color: #aaa;
  font-size: 15px;
  margin-bottom: 25px;
}

/* Search */
.search {
  width: 100%;
  padding: 17px 20px;
  border-radius: 16px;
  border: 1px solid #292929;
  background: #111;
  color: white;
  font-size: 16px;
  outline: none;
  margin-bottom: 30px;
}

.search:focus {
  border-color: #ff0718;
  box-shadow: 0 0 0 2px rgba(255,0,20,.12);
}

.search::placeholder {
  color: #666;
}

/* Sections */
.section-title {
  font-size: 23px;
  font-weight: 800;
  margin: 28px 0 14px;
}

/* Creator pick */
.pick {
  background: linear-gradient(135deg, #171717, #0d0d0d);
  border: 1px solid #292929;
  border-radius: 18px;
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.pick::after {
  content: "🎸";
  position: absolute;
  right: 15px;
  bottom: -20px;
  font-size: 100px;
  opacity: .08;
}

.pick-title {
  font-size: 20px;
  font-weight: 800;
}

.pick-subtitle {
  color: #888;
  margin-top: 5px;
}

/* Upload */
.upload {
  width: 100%;
  background: #ff0718;
  color: white;
  border: none;
  border-radius: 14px;
  padding: 16px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  margin-bottom: 15px;
}

.upload:active {
  transform: scale(.98);
}

/* Song card */
.song {
  display: flex;
  align-items: center;
  gap: 14px;
  background: #111;
  border: 1px solid #292929;
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 12px;
}

.cover {
  width: 58px;
  height: 58px;
  border-radius: 14px;
  background: linear-gradient(135deg, #ff0018, #5b0008);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  flex-shrink: 0;
}

.song-info {
  flex: 1;
  min-width: 0;
}

.song-name {
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.song-type {
  color: #777;
  font-size: 13px;
  margin-top: 4px;
}

.play {
  background: #ff0718;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 11px 15px;
  font-weight: 800;
}

.favorite {
  background: #242424;
  color: white;
  border: none;
  width: 46px;
  height: 46px;
  border-radius: 12px;
  font-size: 20px;
}

/* Empty state */
.empty {
  text-align: center;
  color: #666;
  padding: 35px 10px;
}

.profile {
  background: #111;
  border: 1px solid #292929;
  border-radius: 18px;
  padding: 18px;
}
