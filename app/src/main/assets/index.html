<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost Guitar</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --red:#78101d;
  --red2:#a8172b;
  --bright:#ff263d;
  --line:#777;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:#fff;
  background:#090506;
}

body{
  background:
    linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.35)),
    url("assets/lost_crimson.png") center/cover fixed;
}

.app{height:100vh}

.content{
  height:100%;
  overflow-y:auto;
  padding:20px 16px 105px;
}

.page{display:none}
.page.active{display:block}

/* GLASS EFFECT, SOLID RED */
.glass{
  background:rgba(22,5,8,.72);
  border:1.5px solid var(--line);
  border-radius:20px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.16),
    0 7px 20px rgba(0,0,0,.35);
}

/* HOME */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}

.greeting{
  font-size:25px;
  font-weight:700;
  text-shadow:0 2px 8px #000;
}

.settings{
  width:46px;
  height:46px;
  border:2px solid #ff5262;
  border-radius:15px;
  background:var(--bright);
  color:#fff;
  font-size:21px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    0 0 14px rgba(255,25,50,.4);
}

.section{margin-bottom:22px}

.title{
  font-size:18px;
  font-weight:700;
  margin-bottom:10px;
  text-shadow:0 2px 7px #000;
}

.card{
  padding:16px;
  margin-bottom:10px;
}

.card p{
  opacity:.68;
  margin-top:5px;
}

/* BUTTONS */
.btn{
  color:#fff;
  background:linear-gradient(145deg,#8e1424,#65101a);
  border:2px solid var(--line);
  border-radius:15px;
  padding:11px 16px;
  font-size:15px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -2px 5px rgba(0,0,0,.25),
    0 5px 12px rgba(0,0,0,.3);
  transition:.12s;
}

.btn:active{
  transform:scale(.97);
  border-color:#fff;
}

/* PLAYER */
.player{
  padding:22px;
  text-align:center;
}

.player-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
}

.record{
  width:185px;
  height:185px;
  border-radius:50%;
  flex-shrink:0;
  background:
    repeating-radial-gradient(
      circle,
      #080808 0 3px,
      #191919 4px 6px
    );
  border:5px solid #303030;
  box-shadow:0 8px 25px rgba(0,0,0,.65);
}

.record:after{
  content:"";
  display:block;
  width:34px;
  height:34px;
  margin:70px auto;
  border-radius:50%;
  background:#9d1629;
  border:4px solid #111;
}

.song{
  margin-top:18px;
}

.song h2{font-size:20px}
.song p{opacity:.65;margin-top:5px}

/* PROFILE */
.banner{
  height:155px;
  position:relative;
}

.pfp{
  position:absolute;
  left:20px;
  bottom:-45px;
  width:92px;
  height:92px;
  border-radius:50%;
  background:#222;
  border:5px solid #100407;
  box-shadow:0 5px 18px #000;
}

.profile{
  padding:58px 3px 20px;
}

.username-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.username{
  font-size:23px;
  font-weight:700;
}

.pick{
  width:31px;
  height:31px;
  border-radius:50%;
  border:1.5px solid var(--line);
  background:#72101c;
  color:#fff;
}

.bio{
  opacity:.65;
  margin-top:6px;
}

/* PROFILE BUTTONS */
.profile-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

.save{
  margin-top:10px;
}

.save.hidden{display:none}

.save .btn{
  width:100%;
}

/* BOTTOM NAV */
.nav{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  height:68px;
  padding:7px;
  display:flex;
  gap:8px;
  z-index:10;
  background:rgba(17,4,7,.88);
  border:1.5px solid #666;
  border-radius:21px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.12),
    0 7px 20px rgba(0,0,0,.45);
}

.nav button{
  flex:1;
  border:2px solid var(--line);
  border-radius:15px;
  background:#65101a;
  color:#fff;
  font-size:13px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
}

.nav button.active{
  border-color:#fff;
  background:#8e1424;
}

.icon{
  display:block;
  height:20px;
  margin-bottom:3px;
}

/* HOUSE */
.house{
  width:18px;
  height:14px;
  background:#fff;
  margin:auto;
  clip-path:polygon(50% 0,100% 42%,100% 100%,0 100%,0 42%);
}

/* PLAY */
.play{
  width:0;
  height:0;
  border-top:9px solid transparent;
  border-bottom:9px solid transparent;
  border-left:14px solid #fff;
  margin:auto;
}

/* PROFILE */
.person:before{
  content:"";
  display:block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff;
  margin:0 auto 2px;
}

.person:after{
  content:"";
  display:block;
  width:18px;
  height:10px;
  border-radius:10px 10px 4px 4px;
  background:#fff;
  margin:auto;
}

@media(max-width:370px){
  .record{
    width:150px;
    height:150px;
  }

  .record:after{
    margin:53px auto;
  }

  .greeting{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="app">

<main class="content">

<!-- HOME -->
<section id="home" class="page active">

  <div class="header">
    <div class="greeting" id="greeting"></div>

    <button class="settings">
      ⚙
    </button>
  </div>

  <div class="section">
    <div class="title">Creator's Picks</div>

    <div class="card glass">
      <strong>Featured Music</strong>
      <p>Your featured music will appear here.</p>
    </div>
  </div>

  <div class="section">
    <div class="title">Recently Played</div>

    <div class="card glass">
      <p>No recently played songs.</p>
    </div>
  </div>

  <div class="section">
    <div class="title">Playlists</div>

    <div class="card glass">
      <button class="btn">+ Create Playlist</button>
    </div>
  </div>

</section>


<!-- PLAYER -->
<section id="player" class="page">

  <div class="title">Player</div>

  <div class="player glass">

    <div class="player-row">

      <div class="record"></div>

      <button class="btn" onclick="Android.pickMp3()">
    Upload MP3
      </button>
      
      

    </div>

    <div class="song">
      <h2>No Song Playing</h2>
      <p>Select a song to start listening.</p>
    </div>

    <br>

    <button class="btn">
      ▶ Play
    </button>

  </div>

</section>


<!-- PROFILE -->
<section id="profile" class="page">

  <div class="banner glass">
    <div class="pfp"></div>
  </div>

  <div class="profile">

    <div class="username-row">

      <div class="username" id="username">
        Your Username
      </div>

      <button class="pick"
              onclick="editUsername()">
        ◇
      </button>

    </div>

    <div class="bio">
      Your bio goes here.
    </div>

    <div class="profile-buttons">

      <button class="btn"
              onclick="changed()">
        Change PFP
      </button>

      <button class="btn"
              onclick="changed()">
        Change Banner
      </button>

    </div>

    <div class="save hidden" id="save">

      <button class="btn"
              onclick="saved()">
        Save Changes
      </button>

    </div>

  </div>

</section>

</main>


<!-- BOTTOM NAV -->
<nav class="nav">

  <button class="active"
          onclick="page('home',this)">
    <span class="icon">
      <span class="house"></span>
    </span>
    Home
  </button>

  <button onclick="page('player',this)">
    <span class="icon">
      <span class="play"></span>
    </span>
    Play
  </button>

  <button onclick="page('profile',this)">
    <span class="icon">
      <span class="person"></span>
    </span>
    Profile
  </button>

</nav>

</div>


<script>

/* NAVIGATION */
function page(id,btn){

  document.querySelectorAll(".page")
    .forEach(function(x){
      x.classList.remove("active");
    });

  document.getElementById(id)
    .classList.add("active");

  document.querySelectorAll(".nav button")
    .forEach(function(x){
      x.classList.remove("active");
    });

  btn.classList.add("active");
}


/* GREETING */
var h=new Date().getHours();
var g="Good night";

if(h>=5&&h<12)g="Good morning";
else if(h>=12&&h<17)g="Good afternoon";
else if(h>=17&&h<21)g="Good evening";

document.getElementById("greeting").textContent=g;


/* PROFILE SAVE */
function changed(){
  document.getElementById("save")
    .classList.remove("hidden");
}

function saved(){
  document.getElementById("save")
    .classList.add("hidden");
}

function editUsername(){

  var n=prompt("Change username:");

  if(n&&n.trim()){
    document.getElementById("username")
      .textContent=n.trim();

    changed();
  }
}
/* =========================
   LOSTGUITAR ANDROID AUDIO
   ========================= */

window.addImportedMp3 = function(name) {

    var title = document.querySelector(".song h2");
    var subtitle = document.querySelector(".song p");

    if (title) {
        title.textContent = name;
    }

    if (subtitle) {
        subtitle.textContent = "Ready to play";
    }
};


window.onNativeSongReady = function(name) {

    var title = document.querySelector(".song h2");

    if (title) {
        title.textContent = name;
    }
};


window.onNativePlay = function() {

    var playButtons =
        document.querySelectorAll(
            '[onclick*="play"], .play'
        );

    playButtons.forEach(function(button) {
        button.classList.add("playing");
    });
};


window.onNativePause = function() {

    var playButtons =
        document.querySelectorAll(
            '[onclick*="play"], .play'
        );

    playButtons.forEach(function(button) {
        button.classList.remove("playing");
    });
};


window.onNativeStop = function() {

    var playButtons =
        document.querySelectorAll(
            '[onclick*="play"], .play'
        );

    playButtons.forEach(function(button) {
        button.classList.remove("playing");
    });
};


window.onNativeError = function() {

    var subtitle =
        document.querySelector(".song p");

    if (subtitle) {
        subtitle.textContent =
            "Couldn't play this MP3";
    }
};
</script>

</body>
  </html>
